<ion-menu side="end" [contentId]="contentId" [menuId]="contentId + '-menu'">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="end">
        <ion-menu-toggle [menu]="contentId + '-menu'">
          <ion-button style="color: #ffffff; --color: #ffffff;">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="menu-content">
    <div class="menu-profile-container">
      <div class="avatar-wrapper">
        <img [src]="userImage" alt="User Image" class="menu-user-image" />
      </div>
      <div class="profile-details">
        <h3 class="menu-username">
          {{ username }}
        </h3>
        <p class="menu-company">{{ companyName }}</p>
        <div *ngIf="selectedPerimeterName" style="margin-top: 8px;">
          <ion-badge
            [color]="selectedPerimeterName === 'Office' ? 'success' : (selectedPerimeterName === 'Field Duty' ? 'warning' : 'secondary')"
            style="padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
            {{ selectedPerimeterName }}
          </ion-badge>
        </div>
      </div>
    </div>

    <div class="menu-items-container">
      <ion-menu-toggle auto-hide="false" *ngIf="!isCheckedIn() && selectedPerimeterName" [menu]="contentId + '-menu'">
        <ion-item (click)="switchMode()" button detail="false" class="menu-switch-button">
          <ion-icon name="swap-horizontal-outline" slot="start"></ion-icon>
          <ion-label>Switch Attendance Mode</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="false" [menu]="contentId + '-menu'">
        <ion-item (click)="logout()" button detail="false" class="menu-logout-button">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </div>
  </ion-content>
</ion-menu>

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="showBackButton">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      <img src="assets/icon/logo.png" alt="ZeoHRM Logo" class="header-logo" (click)="goBack()" style="cursor: pointer;" />
    </ion-title>
    <ion-buttons slot="end">
      <ion-menu-button [menu]="contentId + '-menu'"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
