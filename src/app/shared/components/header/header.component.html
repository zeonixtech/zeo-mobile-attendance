<ion-menu side="end" [contentId]="contentId">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="end">
        <ion-menu-toggle>
          <ion-button color="medium">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="menu-content">
    <div class="menu-profile-container">
      <div class="avatar-wrapper">
        <img [src]="userImage" alt="User Image" class="menu-user-image" />
      </div>
      <div class="profile-details">
        <h3 class="menu-username">
          <!-- {{ username }} -->
          Anupam Bhandari
        </h3>
        <p class="menu-company">{{ companyName }}</p>
      </div>
    </div>

    <div class="menu-items-container">
      <ion-menu-toggle auto-hide="false">
        <ion-item (click)="logout()" button detail="false" class="menu-logout-button">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </div>
  </ion-content>
</ion-menu>

<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      <img src="assets/icon/logo.png" alt="ZeoHRM Logo" class="header-logo" />
    </ion-title>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
